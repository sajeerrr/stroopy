<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stroop Challenge</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0a0f;--surface:#13131a;--surface2:#1c1c27;--border:#2a2a3d;
    --accent:#c8ff00;--text:#f0f0f0;--muted:#6b6b80;--green:#00e676;--red:#ff4d6d;--radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Syne',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;
    background:radial-gradient(ellipse at 20% 50%,rgba(200,255,0,.04) 0%,transparent 60%),
               radial-gradient(ellipse at 80% 20%,rgba(0,212,255,.04) 0%,transparent 60%);pointer-events:none}
  .screen{width:100%;max-width:520px;display:none;animation:fadeUp .35s ease}
  .screen.active{display:flex;flex-direction:column;gap:1.25rem}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  .logo{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:4px;color:var(--muted);text-transform:uppercase;text-align:center}
  .logo span{color:var(--accent)}
  .hero-title{font-size:clamp(2.5rem,8vw,4rem);font-weight:800;line-height:1;text-align:center;
    background:linear-gradient(135deg,var(--text) 40%,var(--accent));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem}
  input[type="text"]{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;
    color:var(--text);font-family:'Syne',sans-serif;font-size:1rem;padding:.75rem 1rem;outline:none;transition:border-color .2s}
  input:focus{border-color:var(--accent)}
  label{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}
  .btn{font-family:'Space Mono',monospace;font-size:13px;letter-spacing:1px;text-transform:uppercase;
    padding:.85rem 1.5rem;border-radius:8px;border:none;cursor:pointer;transition:transform .1s,opacity .2s;width:100%}
  .btn:active{transform:scale(.97)}
  .btn-primary{background:var(--accent);color:#000;font-weight:700}
  .btn-primary:hover{opacity:.88}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
  .btn-ghost:hover{border-color:var(--text);color:var(--text)}
  .btn-sm{padding:.5rem 1rem;font-size:11px;width:auto}
  .nav{display:flex;align-items:center;justify-content:space-between}
  .nav-title{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
  .home-grid{display:flex;flex-direction:column;gap:10px}
  .home-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .stat-box{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:.75rem;text-align:center}
  .stat-box .val{font-size:1.6rem;font-weight:700;color:var(--accent);font-family:'Space Mono',monospace}
  .stat-box .lbl{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-top:2px}
  #arena{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);min-height:170px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:2rem 1rem;position:relative;overflow:hidden}
  #arena::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(200,255,0,.03) 0%,transparent 70%)}
  #word-display{font-size:clamp(2.8rem,10vw,4.5rem);font-weight:800;letter-spacing:3px;text-transform:uppercase;font-family:'Space Mono',monospace;position:relative}
  #instruction{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);position:relative}
  #timer-wrap{width:85%;height:4px;background:var(--surface2);border-radius:999px;overflow:hidden;position:relative}
  #timer-bar{height:100%;border-radius:999px;background:var(--accent);transition:width .08s linear,background .3s}
  #choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .choice-btn{font-family:'Space Mono',monospace;font-size:13px;letter-spacing:1px;text-transform:uppercase;
    padding:1rem;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;
    transition:transform .1s,border-color .15s,background .15s}
  .choice-btn:hover{border-color:var(--muted);background:var(--surface2)}
  .choice-btn:active{transform:scale(.97)}
  .choice-btn.correct{background:rgba(0,230,118,.12);border-color:var(--green);color:var(--green)}
  .choice-btn.wrong{background:rgba(255,77,109,.12);border-color:var(--red);color:var(--red)}
  #feedback{font-family:'Space Mono',monospace;font-size:13px;min-height:20px;text-align:center;letter-spacing:1px}
  /* leaderboard */
  .hs-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .hs-header-title{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
  .hs-refresh-btn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:4px 10px;
    font-size:11px;font-family:'Space Mono',monospace;cursor:pointer;letter-spacing:1px;transition:color .15s,border-color .15s}
  .hs-refresh-btn:hover{color:var(--text);border-color:var(--muted)}
  .hs-list{display:flex;flex-direction:column;gap:8px;max-height:400px;overflow-y:auto}
  .hs-row{display:flex;align-items:center;gap:12px;padding:.75rem 1rem;background:var(--surface2);border-radius:8px;border:1px solid var(--border)}
  .hs-row.is-you{border-color:rgba(200,255,0,.4);background:rgba(200,255,0,.04)}
  .hs-rank{font-family:'Space Mono',monospace;font-size:12px;color:var(--muted);width:28px;text-align:center;flex-shrink:0}
  .hs-rank.gold{color:#ffd700;font-size:18px}.hs-rank.silver{color:#c0c0c0;font-size:18px}.hs-rank.bronze{color:#cd7f32;font-size:18px}
  .hs-avatar{width:34px;height:34px;border-radius:50%;background:var(--surface);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:'Space Mono',monospace;color:var(--accent);flex-shrink:0}
  .hs-info{flex:1;min-width:0}
  .hs-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
  .hs-meta{font-size:11px;color:var(--muted);font-family:'Space Mono',monospace;margin-top:2px}
  .hs-score-col{font-family:'Space Mono',monospace;font-size:16px;color:var(--accent);font-weight:700;flex-shrink:0}
  .you-badge{font-size:9px;letter-spacing:1px;background:var(--accent);color:#000;border-radius:4px;padding:1px 5px;font-family:'Space Mono',monospace}
  .empty-state{text-align:center;color:var(--muted);font-size:14px;padding:2.5rem 1rem;font-family:'Space Mono',monospace;line-height:2}
  .spinner{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:13px;font-family:'Space Mono',monospace;padding:2.5rem}
  .spin{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .err-state{text-align:center;color:var(--red);font-size:12px;padding:2rem 1rem;font-family:'Space Mono',monospace;line-height:2}
  /* result */
  .result-hero{text-align:center}
  .result-emoji{font-size:3rem}
  .result-title{font-size:1.6rem;font-weight:800;margin:.5rem 0 .25rem}
  .result-sub{color:var(--muted);font-size:13px;font-family:'Space Mono',monospace}
  .result-score{font-size:3.5rem;font-weight:800;color:var(--accent);font-family:'Space Mono',monospace;margin:.5rem 0}
  .player-pill{display:inline-flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:4px 12px 4px 4px;font-size:13px}
  .player-avatar{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#000;font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace}
  @keyframes flash{0%,100%{opacity:1}50%{opacity:.3}}
  .flashing{animation:flash .3s ease}
  ::-webkit-scrollbar{width:4px}
  ::-webkit-scrollbar-track{background:var(--surface2)}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
  #share-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;align-items:center;justify-content:center;padding:1rem}
  #share-modal.open{display:flex}
  .hs-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .hs-tab{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:1px;text-transform:uppercase;
    padding:.65rem;border-radius:8px;border:1px solid var(--border);background:transparent;
    color:var(--muted);cursor:pointer;transition:all .15s}
  .hs-tab:hover{color:var(--text);border-color:var(--muted)}
  .hs-tab.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:700}
  .daily-reset-note{text-align:center;font-size:11px;color:var(--muted);font-family:'Space Mono',monospace;letter-spacing:1px}
  .share-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;width:100%;max-width:420px;display:flex;flex-direction:column;gap:1rem}
  .share-box-title{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
  #share-canvas{width:100%;border-radius:10px;display:block}
  .share-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .share-act-btn{background:transparent;color:var(--muted);border:1px solid var(--border);font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:.65rem .5rem;border-radius:8px;cursor:pointer;transition:color .15s,border-color .15s,background .15s;text-align:center}
  .share-act-btn:hover{color:var(--text);border-color:var(--muted)}
  .share-act-btn.done{color:var(--green);border-color:var(--green)}
</style>
</head>
<body>

<!-- NAME -->
<div class="screen active" id="screen-name">
  <div class="logo">stroop <span>//</span> challenge</div>
  <div class="hero-title">What's your<br>name?</div>
  <div class="card">
    <label for="name-input">your name</label>
    <input type="text" id="name-input" placeholder="enter your name..." maxlength="20" autocomplete="off">
  </div>
  <button class="btn btn-primary" id="btn-save-name">Let's Go →</button>
</div>

<!-- HOME -->
<div class="screen" id="screen-home">
  <div class="nav">
    <div class="logo">stroop <span>//</span> challenge</div>
    <div id="player-pill"></div>
  </div>
  <div class="hero-title">Stroop<br>Challenge</div>
  <div class="home-grid">
    <button class="btn btn-primary" id="btn-start">▶ Start Game</button>
    <div class="home-row">
      <button class="btn btn-ghost" id="btn-go-hs">🏆 Leaderboard</button>
      <button class="btn btn-ghost" id="btn-go-settings">⚙ Settings</button>
    </div>
  </div>
</div>

<!-- GAME -->
<div class="screen" id="screen-game">
  <div class="nav">
    <div id="game-player-pill"></div>
    <button class="btn btn-ghost btn-sm" id="btn-quit">✕ quit</button>
  </div>
  <div class="stats-row">
    <div class="stat-box"><div class="val" id="stat-score">0</div><div class="lbl">score</div></div>
    <div class="stat-box"><div class="val" id="stat-round">0/20</div><div class="lbl">round</div></div>
    <div class="stat-box"><div class="val" id="stat-streak">0</div><div class="lbl">streak 🔥</div></div>
  </div>
  <div id="arena">
    <div id="word-display" style="color:var(--text)">—</div>
    <div id="timer-wrap"><div id="timer-bar"></div></div>
    <div id="instruction">get ready</div>
  </div>
  <div id="choices"></div>
  <div id="feedback">&nbsp;</div>
</div>

<!-- RESULT -->
<div class="screen" id="screen-result">
  <div class="result-hero card">
    <div class="result-emoji" id="result-emoji">🎉</div>
    <div class="result-title" id="result-title">Well played!</div>
    <div class="result-score" id="result-score">0</div>
    <div class="result-sub" id="result-sub">pts</div>
  </div>
  <button class="btn btn-primary" id="btn-play-again">▶ Play Again</button>
  <button class="btn btn-ghost" id="btn-share-open">📤 Share Result</button>
  <div class="home-row">
    <button class="btn btn-ghost" id="btn-result-hs">🏆 Leaderboard</button>
    <button class="btn btn-ghost" id="btn-result-home">⌂ Home</button>
  </div>
</div>

<!-- SHARE MODAL -->
<div id="share-modal">
  <div class="share-box">
    <div class="share-box-title">📤 Share your result</div>
    <canvas id="share-canvas" width="800" height="420"></canvas>
    <div class="share-actions">
      <button class="share-act-btn" id="btn-share-download">⬇ save image</button>
      <button class="share-act-btn" id="btn-share-copy-link">🔗 copy link</button>
      <button class="share-act-btn" id="btn-share-native">↗ share</button>
    </div>
    <button class="btn btn-ghost" id="btn-share-close" style="margin-top:-.25rem">close</button>
  </div>
</div>

<!-- LEADERBOARD -->
<div class="screen" id="screen-hs">
  <div class="nav">
    <div class="nav-title">🏆 Global Leaderboard</div>
    <button class="btn btn-ghost btn-sm" id="btn-hs-back">← back</button>
  </div>
  <div class="hs-tabs">
    <button class="hs-tab active" id="tab-daily" onclick="switchTab('daily')">Today</button>
    <button class="hs-tab" id="tab-alltime" onclick="switchTab('alltime')">All Time</button>
  </div>
  <div class="card">
    <div class="hs-header">
      <div class="hs-header-title" id="hs-tab-label">top 10 · all time · best score per player</div>
      <button class="hs-refresh-btn" id="btn-hs-refresh">↻ refresh</button>
    </div>
    <div class="hs-list" id="hs-list">
      <div class="spinner"><div class="spin"></div>&nbsp;loading...</div>
    </div>
  </div>
  <div class="daily-reset-note" id="daily-reset-note" style="display:none">
    🕛 resets daily at midnight
  </div>
</div>

<!-- SETTINGS -->
<div class="screen" id="screen-settings">
  <div class="nav">
    <div class="nav-title">⚙ Settings</div>
    <button class="btn btn-ghost btn-sm" id="btn-settings-back">← back</button>
  </div>
  <div class="card" style="display:flex;flex-direction:column;gap:.75rem">
    <label for="setting-name">change your name</label>
    <input type="text" id="setting-name" placeholder="enter new name..." maxlength="20" autocomplete="off">
  </div>
  <button class="btn btn-primary" id="btn-save-settings">Save</button>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
//  GLOBAL LEADERBOARD — Firebase Realtime Database (free tier)
//
//  SETUP (one time, 2 minutes):
//  1. Go to https://console.firebase.google.com
//  2. Create a project (any name, disable Analytics)
//  3. Build → Realtime Database → Create Database → Start in TEST mode
//  4. Copy your database URL (looks like: https://XXXX-default-rtdb.firebaseio.com)
//  5. Paste it below as FIREBASE_URL
// ═══════════════════════════════════════════════════════════════

const FIREBASE_URL = 'https://stroopy-98e20-default-rtdb.asia-southeast1.firebasedatabase.app';

const SCORES_ENDPOINT   = FIREBASE_URL + '/leaderboard.json';
const DAILY_BASE        = FIREBASE_URL + '/daily';

const ROUNDS = 20;
const SECS   = 2;

const COLORS = [
  {name:'red',    hex:'#ff4d6d'},
  {name:'blue',   hex:'#00d4ff'},
  {name:'green',  hex:'#00e676'},
  {name:'yellow', hex:'#ffd600'},
  {name:'purple', hex:'#c77dff'},
  {name:'orange', hex:'#ff9100'},
];

let playerName = localStorage.getItem('stroop_name') || '';
let score=0,round=0,streak=0,answered=false,timeLeft=0;
let currentInk=null,timerInterval=null,nextRoundTimer=null;
let activeTab='daily';

// Returns today's date key e.g. "2025-05-12"
function todayKey(){
  const d=new Date();
  return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// ── Firebase helpers ────────────────────────────────────────
async function getScores() {
  try {
    const r = await fetch(SCORES_ENDPOINT);
    if (!r.ok) return [];
    const data = await r.json();
    if (!data) return [];
    return Object.values(data);
  } catch(e) { return []; }
}

async function getDailyScores() {
  try {
    const key = todayKey();
    const r = await fetch(`${DAILY_BASE}/${key}.json`);
    if (!r.ok) return [];
    const data = await r.json();
    if (!data) return [];
    return Object.values(data);
  } catch(e) { return []; }
}

// Clean up old daily entries (keep only last 7 days) — runs silently
async function cleanOldDays() {
  try {
    const r = await fetch(`${DAILY_BASE}.json`);
    if (!r.ok) return;
    const data = await r.json();
    if (!data) return;
    const today = new Date();
    const keys = Object.keys(data);
    for (const k of keys) {
      const d = new Date(k);
      if ((today - d) > 7 * 86400000) {
        fetch(`${DAILY_BASE}/${k}.json`, {method:'DELETE'}).catch(()=>{});
      }
    }
  } catch(e) {}
}

async function submitScore(name, newScore) {
  const key = name.toLowerCase().replace(/[^a-z0-9_]/g, '_');

  // ── All-time ──
  try {
    const r = await fetch(SCORES_ENDPOINT);
    let data = r.ok ? (await r.json() || {}) : {};
    const ex = data[key];
    if (!ex || newScore > ex.score) {
      data[key] = { name, score: newScore, date: Date.now() };
    }
    await fetch(SCORES_ENDPOINT, {
      method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)
    });
  } catch(e) { console.warn('Score save failed:', e); }

  // ── Daily ──
  try {
    const dayKey = todayKey();
    const endpoint = `${DAILY_BASE}/${dayKey}.json`;
    const r2 = await fetch(endpoint);
    let dayData = r2.ok ? (await r2.json() || {}) : {};
    const ex2 = dayData[key];
    if (!ex2 || newScore > ex2.score) {
      dayData[key] = { name, score: newScore, date: Date.now() };
    }
    await fetch(endpoint, {
      method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(dayData)
    });
  } catch(e) { console.warn('Daily score save failed:', e); }

  cleanOldDays();
}

// ── Utils ───────────────────────────────────────────────────
function shuffle(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function saveName(){localStorage.setItem('stroop_name',playerName)}
function initials(n){return(n||'?').trim().split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,2)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function timeAgo(ts){
  if(!ts)return'';
  const m=Math.floor((Date.now()-ts)/60000);
  if(m<1)return'just now';if(m<60)return`${m}m ago`;
  const h=Math.floor(m/60);if(h<24)return`${h}h ago`;
  return`${Math.floor(h/24)}d ago`;
}
function pillHTML(name){
  return`<div class="player-pill"><div class="player-avatar">${initials(name)}</div><span>${esc(name)}</span></div>`;
}

// ── Screens ─────────────────────────────────────────────────
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
}
function goHome(){
  document.getElementById('player-pill').innerHTML=pillHTML(playerName);
  show('home');
}

// ── Name screen ─────────────────────────────────────────────
if(playerName){document.addEventListener('DOMContentLoaded',()=>goHome())}

document.getElementById('btn-save-name').onclick=()=>{
  const v=document.getElementById('name-input').value.trim();
  if(!v){document.getElementById('name-input').focus();return;}
  playerName=v;saveName();goHome();
};
document.getElementById('name-input').addEventListener('keydown',e=>{
  if(e.key==='Enter')document.getElementById('btn-save-name').click();
});

// ── Home ────────────────────────────────────────────────────
document.getElementById('btn-start').onclick      =startGame;
document.getElementById('btn-go-hs').onclick      =openHS;
document.getElementById('btn-go-settings').onclick=openSettings;

// ── Settings ────────────────────────────────────────────────
function openSettings(){
  document.getElementById('setting-name').value=playerName;
  show('settings');
}
document.getElementById('btn-settings-back').onclick=goHome;
document.getElementById('btn-save-settings').onclick=()=>{
  const n=document.getElementById('setting-name').value.trim();
  if(n){playerName=n;saveName();}
  goHome();
};

// ── Leaderboard ─────────────────────────────────────────────
async function openHS(){show('hs');await loadAndRender();}

function switchTab(tab){
  activeTab=tab;
  document.getElementById('tab-alltime').classList.toggle('active', tab==='alltime');
  document.getElementById('tab-daily').classList.toggle('active',   tab==='daily');
  loadAndRender();
}

async function loadAndRender(){
  const list=document.getElementById('hs-list');
  const note=document.getElementById('daily-reset-note');
  list.innerHTML='<div class="spinner"><div class="spin"></div>&nbsp;loading global scores...</div>';

  if(!FIREBASE_URL||FIREBASE_URL==='YOUR_FIREBASE_URL'){
    list.innerHTML='<div class="err-state">⚠ Firebase not configured.<br>See setup instructions in the code.</div>';
    return;
  }

  if(activeTab==='daily'){
    document.getElementById('hs-tab-label').textContent="today's top 10 · resets at midnight";
    note.style.display='block';
    const scores=await getDailyScores();
    renderHS(scores);
  } else {
    document.getElementById('hs-tab-label').textContent='top 10 · all time · best score per player';
    note.style.display='none';
    const scores=await getScores();
    renderHS(scores);
  }
}

function renderHS(scores){
  const list=document.getElementById('hs-list');
  if(!scores.length){
    const msg=activeTab==='daily'
      ? 'no scores today yet —<br>be the first to play! 🎮'
      : 'no scores yet —<br>be the first to play! 🎮';
    list.innerHTML=`<div class="empty-state">${msg}</div>`;
    return;
  }
  const top10=[...scores].sort((a,b)=>b.score-a.score).slice(0,10);
  list.innerHTML=top10.map((e,i)=>{
    const rc=i===0?'gold':i===1?'silver':i===2?'bronze':'';
    const rl=i===0?'🥇':i===1?'🥈':i===2?'🥉':`#${i+1}`;
    const you=e.name.toLowerCase()===playerName.toLowerCase();
    return`<div class="hs-row${you?' is-you':''}">
      <div class="hs-rank ${rc}">${rl}</div>
      <div class="hs-avatar">${initials(e.name)}</div>
      <div class="hs-info">
        <div class="hs-name">${esc(e.name)}${you?'<span class="you-badge">you</span>':''}</div>
        <div class="hs-meta">${timeAgo(e.date)}</div>
      </div>
      <div class="hs-score-col">${e.score}</div>
    </div>`;
  }).join('');
}

document.getElementById('btn-hs-back').onclick   =goHome;
document.getElementById('btn-result-hs').onclick =()=>{switchTab('daily');openHS();};
document.getElementById('btn-hs-refresh').onclick=loadAndRender;

// ── Game ────────────────────────────────────────────────────
function startGame(){
  score=0;round=0;streak=0;
  document.getElementById('game-player-pill').innerHTML=pillHTML(playerName);
  document.getElementById('stat-score').textContent=0;
  document.getElementById('stat-round').textContent='0/'+ROUNDS;
  document.getElementById('stat-streak').textContent=0;
  document.getElementById('feedback').innerHTML='&nbsp;';
  document.getElementById('choices').innerHTML='';
  show('game');
  setTimeout(nextRound,400);
}

function nextRound(){
  if(round>=ROUNDS){endGame();return;}
  answered=false;round++;
  document.getElementById('stat-round').textContent=round+'/'+ROUNDS;
  document.getElementById('feedback').innerHTML='&nbsp;';

  const sh=shuffle(COLORS);
  const wordColor=sh[0];currentInk=sh[1];

  const wd=document.getElementById('word-display');
  wd.classList.add('flashing');setTimeout(()=>wd.classList.remove('flashing'),300);
  wd.textContent=wordColor.name.toUpperCase();wd.style.color=currentInk.hex;
  document.getElementById('instruction').textContent='what color is the text printed in?';

  const wrongs=shuffle(COLORS.filter(c=>c.name!==currentInk.name)).slice(0,3);
  const choices=shuffle([currentInk,...wrongs]);
  const choicesEl=document.getElementById('choices');
  choicesEl.innerHTML='';
  choices.forEach(c=>{
    const btn=document.createElement('button');
    btn.className='choice-btn';btn.textContent=c.name;
    btn.onclick=()=>handleAnswer(btn,c);
    choicesEl.appendChild(btn);
  });

  timeLeft=SECS*1000;
  const bar=document.getElementById('timer-bar');
  bar.style.width='100%';bar.style.background='var(--accent)';
  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    timeLeft-=50;
    const pct=Math.max(0,timeLeft/(SECS*1000)*100);
    bar.style.width=pct+'%';
    if(pct<40)bar.style.background='#ff9100';
    if(pct<15)bar.style.background='var(--red)';
    if(timeLeft<=0){clearInterval(timerInterval);if(!answered)timeOut();}
  },50);
}

function lockBtns(){document.querySelectorAll('.choice-btn').forEach(b=>b.style.pointerEvents='none')}

function handleAnswer(btn,chosen){
  if(answered)return;answered=true;clearInterval(timerInterval);lockBtns();
  const fb=document.getElementById('feedback');
  if(chosen.name===currentInk.name){
    btn.classList.add('correct');
    const bonus=Math.ceil(timeLeft/200);score+=10+bonus;streak++;
    fb.style.color='var(--green)';
    fb.textContent=streak>=3?`🔥 ON FIRE! +${10+bonus}`:`✓ CORRECT! +${10+bonus}`;
  }else{
    btn.classList.add('wrong');
    document.querySelectorAll('.choice-btn').forEach(b=>{if(b.textContent===currentInk.name)b.classList.add('correct');});
    streak=0;fb.style.color='var(--red)';fb.textContent=`✗ WRONG — it was ${currentInk.name}`;
  }
  document.getElementById('stat-score').textContent=score;
  document.getElementById('stat-streak').textContent=streak;
  nextRoundTimer=setTimeout(nextRound,1100);
}

function timeOut(){
  answered=true;lockBtns();
  document.querySelectorAll('.choice-btn').forEach(b=>{if(b.textContent===currentInk.name)b.classList.add('correct');});
  streak=0;document.getElementById('stat-streak').textContent=0;
  const fb=document.getElementById('feedback');
  fb.style.color='var(--red)';fb.textContent=`⏱ TIME'S UP — it was ${currentInk.name}`;
  nextRoundTimer=setTimeout(nextRound,1200);
}

async function endGame(){
  clearInterval(timerInterval);clearTimeout(nextRoundTimer);
  const pct=score/(ROUNDS*20)*100;
  lastScore=score;
  lastEmoji=pct>=80?'🏆':pct>=55?'🎉':pct>=35?'👍':'😅';
  lastTitle=pct>=80?'Stroop Master!':pct>=55?'Great Round!':pct>=35?'Good Effort!':'Keep Practising!';
  document.getElementById('result-emoji').textContent =lastEmoji;
  document.getElementById('result-title').textContent =lastTitle;
  document.getElementById('result-score').textContent =score;
  document.getElementById('result-sub').textContent   =`pts · ${ROUNDS} rounds · saving score...`;
  show('result');
  await submitScore(playerName,score);
  document.getElementById('result-sub').textContent=`pts · ${ROUNDS} rounds · score saved ✓`;
}

document.getElementById('btn-quit').onclick=()=>{clearInterval(timerInterval);clearTimeout(nextRoundTimer);goHome();};
document.getElementById('btn-play-again').onclick =startGame;
document.getElementById('btn-result-home').onclick=goHome;

// ── Share card ───────────────────────────────────────────────
let lastScore=0, lastEmoji='🎉', lastTitle='';

function openShareModal(){
  drawShareCard();
  document.getElementById('share-modal').classList.add('open');
}

document.getElementById('btn-share-open').onclick  = openShareModal;
document.getElementById('btn-share-close').onclick = ()=>document.getElementById('share-modal').classList.remove('open');
document.getElementById('share-modal').addEventListener('click', e=>{
  if(e.target===document.getElementById('share-modal')) document.getElementById('share-modal').classList.remove('open');
});

function drawShareCard(){
  const canvas = document.getElementById('share-canvas');
  const ctx    = canvas.getContext('2d');
  const W=800, H=420;
  canvas.width=W; canvas.height=H;

  // Background
  ctx.fillStyle='#0a0a0f';
  ctx.fillRect(0,0,W,H);

  // Subtle gradient overlay
  const grad=ctx.createRadialGradient(W*.2,H*.5,0,W*.2,H*.5,W*.6);
  grad.addColorStop(0,'rgba(200,255,0,0.07)');
  grad.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,W,H);

  const grad2=ctx.createRadialGradient(W*.85,H*.2,0,W*.85,H*.2,W*.5);
  grad2.addColorStop(0,'rgba(0,212,255,0.05)');
  grad2.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=grad2;
  ctx.fillRect(0,0,W,H);

  // Border
  ctx.strokeStyle='#2a2a3d';
  ctx.lineWidth=1.5;
  roundRect(ctx,12,12,W-24,H-24,16);
  ctx.stroke();

  // Logo
  ctx.font='bold 13px "Space Mono",monospace';
  ctx.fillStyle='#6b6b80';
  ctx.letterSpacing='4px';
  ctx.fillText('STROOP // CHALLENGE',48,64);
  ctx.letterSpacing='0px';

  // Accent dot
  ctx.fillStyle='#c8ff00';
  ctx.beginPath();ctx.arc(42,59,5,0,Math.PI*2);ctx.fill();

  // Big emoji
  ctx.font='72px serif';
  ctx.fillText(lastEmoji, 48, 185);

  // Score
  ctx.font='bold 96px "Space Mono",monospace';
  ctx.fillStyle='#c8ff00';
  ctx.fillText(lastScore, 48, 290);

  // pts label
  ctx.font='16px "Space Mono",monospace';
  ctx.fillStyle='#6b6b80';
  ctx.fillText('PTS · '+ROUNDS+' ROUNDS', 52, 322);

  // Player name
  ctx.font='bold 28px "Syne",sans-serif';
  ctx.fillStyle='#f0f0f0';
  ctx.fillText(playerName, 48, 375);

  // Right side — title + challenge text
  ctx.font='bold 36px "Syne",sans-serif';
  ctx.fillStyle='#f0f0f0';
  ctx.textAlign='right';
  wrapText(ctx, lastTitle, W-48, 180, 320, 44);

  ctx.font='18px "Space Mono",monospace';
  ctx.fillStyle='#6b6b80';
  ctx.fillText('can you beat me?', W-48, 300);

  // Site URL
  ctx.font='13px "Space Mono",monospace';
  ctx.fillStyle='rgba(200,255,0,0.6)';
  ctx.fillText(window.location.hostname, W-48, 375);

  ctx.textAlign='left';
}

function wrapText(ctx,text,x,y,maxW,lineH){
  const words=text.split(' ');let line='';
  for(let i=0;i<words.length;i++){
    const test=line+words[i]+' ';
    if(ctx.measureText(test).width>maxW&&i>0){
      ctx.fillText(line.trim(),x,y);line=words[i]+' ';y+=lineH;
    }else{line=test;}
  }
  ctx.fillText(line.trim(),x,y);
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
  ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);
  ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);
  ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);
  ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
}

document.getElementById('btn-share-download').onclick=()=>{
  const a=document.createElement('a');
  a.download='stroop-result.png';
  a.href=document.getElementById('share-canvas').toDataURL('image/png');
  a.click();
};

document.getElementById('btn-share-copy-link').onclick=async()=>{
  const url=window.location.href;
  await navigator.clipboard.writeText(url).catch(()=>{});
  const btn=document.getElementById('btn-share-copy-link');
  btn.textContent='✓ copied!';btn.classList.add('done');
  setTimeout(()=>{btn.textContent='🔗 copy link';btn.classList.remove('done');},2000);
};

document.getElementById('btn-share-native').onclick=async()=>{
  const canvas=document.getElementById('share-canvas');
  const text=`I scored ${lastScore} pts in Stroop Challenge — can you beat me? 🎨`;
  const url=window.location.href;
  if(navigator.share){
    try{
      canvas.toBlob(async blob=>{
        const file=new File([blob],'stroop-result.png',{type:'image/png'});
        if(navigator.canShare&&navigator.canShare({files:[file]})){
          await navigator.share({title:'Stroop Challenge',text,files:[file],url});
        }else{
          await navigator.share({title:'Stroop Challenge',text,url});
        }
      },'image/png');
    }catch(e){}
  }else{
    // Fallback: copy text
    await navigator.clipboard.writeText(`${text} ${url}`).catch(()=>{});
    const btn=document.getElementById('btn-share-native');
    btn.textContent='✓ copied!';btn.classList.add('done');
    setTimeout(()=>{btn.textContent='↗ share';btn.classList.remove('done');},2000);
  }
};
</script>
